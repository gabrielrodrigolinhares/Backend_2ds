<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Re:Zero - Começando uma Vida em Outro Mundo</title>
    <!-- Script para Ícones Modernos (Lucide) -->
    <script src="https://unpkg.com"></script>
    <style>
        /* Reset e Variáveis de Cores Modernas */
        :root {
            --bg-dark: #0a0512;
            --purple-primary: #8a2be2;
            --purple-glow: #bd34fe;
            --text-light: #f5f3f7;
            --text-muted: #a099b0;
            --glass-bg: rgba(25, 15, 38, 0.65);
            --glass-border: rgba(138, 43, 226, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Fundo Estilizado com Imagem do Unsplash (Atmosfera escura/mágica do anime) */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(10, 5, 18, 0.9), rgba(30, 10, 50, 0.75)), 
                        url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            z-index: -1;
            filter: blur(4px);
        }

        /* Card Principal (Glassmorphism) */
        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 3rem 2rem;
            border-radius: 24px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 
                        0 0 40px rgba(138, 43, 226, 0.15);
            animation: fadeIn 0.8s ease-out;
        }

        /* Elemento Visual Superior (Ícone com Brilho) */
        .brand-icon-wrapper {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--purple-primary), var(--purple-glow));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 0 20px var(--purple-primary);
        }

        .brand-icon-wrapper i {
            color: white;
            stroke-width: 2px;
        }

        /* Título Principal Estilizado */
        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #ffffff 30%, #d8b4fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Subtítulo */
        p {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        /* Link/Botão Ultra Moderno */
        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, var(--purple-primary), var(--purple-glow));
            color: white;
            text-decoration: none;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
        }

        /* Efeitos de Hover (Passar o mouse) */
        .btn-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(138, 43, 226, 0.5);
            background: linear-gradient(135deg, var(--purple-glow), var(--purple-primary));
        }

        .btn-action:active {
            transform: translateY(-1px);
        }

        /* Animação de Entrada */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ícone modernizado representando o "Retorno através da Morte" (Ampulheta/Tempo) -->
        <div class="brand-icon-wrapper">
            <i data-lucide="hourglass"></i>
        </div>

        <h1>Página Inicial</h1>
        <p>Olá, você está em casa... Mas cuidado, neste mundo o seu tempo é um ciclo precioso.</p>
        
        <!-- Link modificado com comportamento de botão e ícone moderno -->
        <a href="/sobre" class="btn-action">
            <span>Explorar sobre o mundo</span>
            <i data-lucide="arrow-right" size="18"></i>
        </a>
    </div>

    <!-- Inicialização dos ícones do Lucide -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
